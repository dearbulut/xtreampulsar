name: 💡 Feature request
description: Suggest a new capability or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape XtreamPulsar. The most useful requests describe the
        **operational problem** you are trying to solve, not only the solution you have in mind.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Streaming core / Xtream API
        - Users, lines & packages
        - Resellers, billing & WHMCS
        - Catch-up, DVR & timeshift
        - EPG, playlists & metadata
        - Security & anti-piracy
        - Panel UI / UX
        - Installer, updates & deployment
        - Multi-server / load balancing
        - Analytics & reporting
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What is painful, slow or impossible today?
      placeholder: "As an operator with ~5000 lines, I have to ... every day, which takes ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like XtreamPulsar to do?
    validations:
      required: true

  - type: input
    id: prior-art
    attributes:
      label: Prior art
      description: Does XtreamUI, XUI.ONE or another panel already do this? How?
      placeholder: "XUI.ONE has this under Tools -> ..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What are you doing instead right now?
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this
          required: false
